<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Foundation — Together We Rise</title>
<meta name="description" content="A non-profit foundation empowering communities through education, food, healthcare, women empowerment and sustainability.">
<meta name="theme-color" content="#0b6b73">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf5f3;--bg2:#fdf5e9;--ink:#0d2b30;--muted:#4b6a70;--p:#0b6b73;--p2:#14a39a;--a:#f2994a;--glass:rgba(255,255,255,.52);--gb:rgba(255,255,255,.75);--drop:rgba(255,255,255,.93);--sh:0 10px 34px rgba(11,75,85,.15);--o1:#5fd3c4;--o2:#ffc98b;--o3:#9bd0f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#061a1e;--bg2:#0b2227;--ink:#e8f4f3;--muted:#9bbcc0;--p:#3cc4b8;--p2:#1b8f8a;--glass:rgba(18,52,58,.5);--gb:rgba(255,255,255,.14);--drop:rgba(10,36,42,.95);--sh:0 10px 34px rgba(0,0,0,.45);--o1:#0f6d6d;--o2:#8a4f1c;--o3:#1d4a78}}
:root[data-theme="dark"]{--bg:#061a1e;--bg2:#0b2227;--ink:#e8f4f3;--muted:#9bbcc0;--p:#3cc4b8;--p2:#1b8f8a;--glass:rgba(18,52,58,.5);--gb:rgba(255,255,255,.14);--drop:rgba(10,36,42,.95);--sh:0 10px 34px rgba(0,0,0,.45);--o1:#0f6d6d;--o2:#8a4f1c;--o3:#1d4a78}
html{scroll-behavior:smooth;scroll-padding-top:90px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed;line-height:1.6;overflow-x:hidden}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;line-height:1.15;margin:0}
a{color:inherit;text-decoration:none}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.65;z-index:0;animation:fl 18s ease-in-out infinite alternate;pointer-events:none}
.orb.a{width:420px;height:420px;background:var(--o1);top:-80px;left:-100px}.orb.b{width:360px;height:360px;background:var(--o2);top:35%;right:-120px;animation-delay:-6s}.orb.c{width:380px;height:380px;background:var(--o3);bottom:-120px;left:25%;animation-delay:-11s}
@keyframes fl{to{transform:translate(50px,40px) scale(1.15)}}
main,footer{position:relative;z-index:1}main{flex:1;padding-top:96px}
.wrap{width:min(1120px,92%);margin:auto}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--gb);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.5);border-radius:26px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:999px;border:1px solid var(--gb);cursor:pointer;font:inherit;font-weight:600;transition:transform .25s;color:var(--ink);background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.btn:hover{transform:translateY(-3px)}
.btn.pri{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-color:transparent;box-shadow:0 8px 24px rgba(20,163,154,.4)}
.btn.acc{background:linear-gradient(135deg,var(--a),#f7b267);color:#3a1d00;border-color:transparent;box-shadow:0 8px 24px rgba(242,153,74,.4)}
/* title bar */
nav{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);width:min(1120px,94%);z-index:50;padding:9px 12px 9px 20px;display:flex;align-items:center;justify-content:space-between;border-radius:999px;transition:padding .3s}
nav.sm{padding-top:5px;padding-bottom:5px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:700;font-size:1.15rem}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--p),var(--a));display:grid;place-items:center;color:#fff}
.links{display:flex;gap:2px;align-items:center}
.links a{padding:8px 13px;border-radius:999px;font-size:.9rem;font-weight:500;color:var(--muted);transition:.2s}
.links a:hover,.links a.on{background:rgba(255,255,255,.4);color:var(--ink)}.links a.on{font-weight:700;color:var(--p)}
.act{display:flex;gap:8px;position:relative}
.ico{width:40px;height:40px;border-radius:50%;border:1px solid var(--gb);background:var(--glass);cursor:pointer;font-size:1.15rem;color:var(--ink);line-height:1}
#menu{display:none}
.drop{position:absolute;right:0;top:calc(100% + 16px);min-width:240px;padding:10px;border-radius:22px;background:var(--drop);border:1px solid var(--gb);box-shadow:var(--sh);opacity:0;pointer-events:none;transform:translateY(-8px) scale(.97);transform-origin:top right;transition:.25s;z-index:60}
.drop.open{opacity:1;pointer-events:auto;transform:none}
.drop a,.drop button{display:flex;gap:10px;width:100%;padding:11px 14px;border:0;background:none;border-radius:14px;font:inherit;font-size:.93rem;font-weight:500;color:var(--ink);cursor:pointer;text-align:left}
.drop a:hover,.drop button:hover{background:rgba(20,163,154,.16)}
.drop hr{border:0;border-top:1px solid var(--gb);margin:6px 8px}
@media(max-width:940px){#menu{display:block}.links{position:absolute;top:calc(100% + 16px);left:0;right:0;flex-direction:column;padding:12px;border-radius:26px;background:var(--drop);border:1px solid var(--gb);box-shadow:var(--sh);opacity:0;pointer-events:none;transform:translateY(-10px);transition:.3s}.links.open{opacity:1;pointer-events:auto;transform:none}.links a{width:100%;text-align:center}}
/* pages */
.chip{display:inline-block;padding:7px 16px;border-radius:999px;font-size:.82rem;font-weight:600;color:var(--p)}
h1{font-size:clamp(2.2rem,5vw,3.8rem);margin:14px 0}
h1 em,h2 em{font-style:italic;background:linear-gradient(120deg,var(--p2),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:1.08rem;color:var(--muted);max-width:560px;margin:0}
.ph{padding-top:20px}.ph .pad{padding:44px 36px}.ph h1{font-size:clamp(2rem,4.5vw,3.2rem)}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0}
.hero{padding:50px 0 40px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.vis{position:relative;aspect-ratio:1;max-width:440px;margin:auto;width:100%}
.disc{position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--o1),var(--p2) 55%,var(--p));display:grid;place-items:center;font-size:7rem;box-shadow:0 30px 80px rgba(11,107,115,.35)}
.fc{position:absolute;padding:14px 18px;font-weight:700;border-radius:20px;animation:bob 6s ease-in-out infinite alternate}
.fc small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
.fc.f1{top:2%;left:-2%}.fc.f2{bottom:8%;right:-2%;animation-delay:-3s}
@keyframes bob{to{transform:translateY(-14px)}}
@media(max-width:880px){.hero{grid-template-columns:1fr}}
.tick{overflow:hidden;padding:14px 0;border-radius:999px}
.tick div{display:flex;gap:40px;width:max-content;animation:mq 30s linear infinite;font-weight:600;color:var(--muted);white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}
.sec{padding:60px 0}
.head{text-align:center;max-width:620px;margin:0 auto 40px}
.head span,.tag{color:var(--a);font-weight:700;letter-spacing:.1em;font-size:.78rem;text-transform:uppercase}
h2{font-size:clamp(1.8rem,4vw,2.7rem);margin:10px 0 12px}
.head p{color:var(--muted);margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}
@media(max-width:880px){.two{grid-template-columns:1fr}}
.pad{padding:32px}.mut{color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.badges span{padding:8px 14px;border-radius:999px;font-size:.85rem;font-weight:600;background:rgba(255,255,255,.35);border:1px solid var(--gb)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px}
.card{padding:28px;transition:transform .35s,box-shadow .35s;display:block}
.card:hover{transform:translateY(-8px);box-shadow:0 20px 50px rgba(11,107,115,.25),inset 0 1px 0 rgba(255,255,255,.6)}
.ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:1.7rem;margin-bottom:16px;background:linear-gradient(135deg,var(--o1),var(--o2))}
.card h3{font-size:1.3rem;margin:6px 0 8px}.card p{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.stat{font-weight:700;color:var(--p)}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.num{padding:30px 20px;text-align:center}.num b{display:block;font-family:'Fraunces',serif;font-size:3rem;color:var(--p)}.num span{color:var(--muted);font-size:.92rem}
blockquote{margin:30px 0 0;padding:34px;text-align:center;font-family:'Fraunces',serif;font-size:1.3rem;font-style:italic}
.av{display:flex;justify-content:center;margin:24px 0}
.av i{width:56px;height:56px;border-radius:50%;margin-left:-12px;display:grid;place-items:center;font-style:normal;font-weight:700;color:#fff;border:3px solid var(--bg)}
.bi{height:150px;border-radius:18px;margin-bottom:16px;display:grid;place-items:center;font-size:3rem}
.post{max-width:760px;margin:auto}.post p{color:var(--muted);font-size:1.05rem}
.gal{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:16px}
.gal div{border-radius:24px;position:relative;overflow:hidden;transition:transform .35s;display:grid;place-items:center;font-size:2.6rem}
.gal div:hover{transform:scale(1.03)}
.gal div span{position:absolute;left:12px;bottom:12px;font-size:.8rem;padding:6px 12px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--gb);font-family:inherit;font-weight:600}
.gal .w{grid-column:span 2;grid-row:span 2;font-size:5rem}
@media(max-width:700px){.gal{grid-template-columns:repeat(2,1fr)}}
.amts{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.amts button{padding:10px 20px;border-radius:999px;border:1px solid var(--gb);background:var(--glass);font:inherit;font-weight:600;color:var(--ink);cursor:pointer}
.amts button.on{background:linear-gradient(135deg,var(--a),#f7b267);color:#3a1d00;border-color:transparent}
form{display:grid;gap:12px}
input,textarea{width:100%;padding:14px 18px;border-radius:16px;border:1px solid var(--gb);background:rgba(255,255,255,.35);font:inherit;color:var(--ink);outline:none}
input:focus,textarea:focus{border-color:var(--p2);box-shadow:0 0 0 3px rgba(20,163,154,.25)}
.msg{font-weight:600;color:var(--p);min-height:1.4em}
details{padding:18px 24px;margin-bottom:14px}summary{cursor:pointer;font-weight:700}details p{color:var(--muted);margin:10px 0 0}
/* footer */
footer{padding:40px 0 26px;color:var(--muted);font-size:.92rem}
footer .glass{padding:34px;border-radius:30px;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:30px}
footer h4{margin:0 0 10px;color:var(--ink)}footer a{display:block;padding:2px 0}footer a:hover{color:var(--p)}
.copy{grid-column:1/-1;border-top:1px solid var(--gb);padding-top:16px;text-align:center}
@media(max-width:760px){footer .glass{grid-template-columns:1fr}}
#top{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:40;opacity:0;pointer-events:none;transition:.3s}#top.show{opacity:1;pointer-events:auto}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);transform:translate(-50%,20px);padding:12px 22px;opacity:0;transition:.3s;z-index:70;font-weight:600;pointer-events:none;border-radius:999px}#toast.show{opacity:1;transform:translate(-50%,0)}
.js .rv{opacity:0;transform:translateY(28px);transition:opacity .7s,transform .7s}.js .rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.js .rv{opacity:1;transform:none}}
@media print{nav,footer,.orb,#top,#toast{display:none!important}main{padding:0}}
</style>
</head>
<body>
<script>document.documentElement.classList.add('js')</script>
<div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>

<!-- TITLE BAR: shown on every page -->
<nav class="glass" id="nav">
  <a href="#/" class="brand"><span class="logo">♥</span><span data-f="name">Your Foundation</span></a>
  <div class="links" id="links"></div>
  <div class="act">
    <button class="ico" id="dots" aria-label="More options" aria-expanded="false" aria-haspopup="true">⋮</button>
    <button class="ico" id="menu" aria-label="Menu">☰</button>
    <div class="drop" id="drop" role="menu"></div>
  </div>
</nav>

<main id="view"></main>

<!-- FOOTER: shown on every page -->
<footer><div class="wrap"><div class="glass" id="foot"></div></div></footer>
<button class="ico glass" id="top" aria-label="Back to top">↑</button>
<div class="glass" id="toast" role="status"></div>

<script>
/* ============ 1. YOUR DETAILS ============ */
const C={name:"Your Foundation",email:"hello@yourfoundation.org",phone:"+91 00000 00000",addr:"Your address, City, State — PIN",donate:"https://example.com/donate"};

/* ============ 2. DATA ============ */
const PR=[["🍱","Food & Clothing","Project Seva","Nutritious meals and clothing for the homeless — feeding hope, one drive at a time.","50,000+ meals distributed"],
["📚","Education","Project Shiksha","Digital literacy, life skills and school support for underprivileged children.","Education for every child"],
["🐾","Animal Welfare","Project Jeev","Rescuing, protecting and feeding stray animals through our volunteers.","50+ animals fed daily"],
["👩","Women Empowerment","Project Udaan","Self-help groups and financial independence for rural women.","Independence & dignity"],
["🌱","Environment","Project Prakriti","Planting saplings and promoting eco-friendly agriculture.","20,000+ saplings planted"],
["💼","Skill Development","Project Vikas","Internships and training that connect young people to real jobs.","30,000+ interns trained"]];
const POSTS=[
{id:"internships",e:"💼",g:"#5fd3c4,#9bd0f5",tag:"Skill Development",d:"01 Mar",t:"Transforming Careers, One Internship at a Time",x:"How our internship programme bridges the gap between education and meaningful work.",b:["For years we have opened doors for young people through hands-on internships in research, finance, marketing and social work.","Every intern leaves with real experience, a stronger network and the confidence to take the next step."]},
{id:"women-rise",e:"👩‍🌾",g:"#ffc98b,#f2994a",tag:"Women Empowerment",d:"30 Jan",t:"Where Women Rise, Dreams Soar",x:"Skills, resources and a strong community network changing lives across rural areas.",b:["Self-help groups give women a voice, savings and a path to independent income.","Together we run skill workshops and health-awareness sessions in villages."]},
{id:"save-a-life",e:"🐕",g:"#9bd0f5,#5fd3c4",tag:"Animal Welfare",d:"30 Jan",t:"In This Life, Save a Life",x:"Shelters, daily feeding and emergency rescue for stray animals.",b:["Our volunteers feed and care for stray animals every day and respond to rescue calls.","You can help with food, time or a small donation."]}];

/* ============ 3. PAGE PARTS ============ */
const rv=h=>`<div class="rv">${h}</div>`;
const sec=h=>`<section class="sec wrap">${h}</section>`;
const head=(a,b,c="")=>`<div class="head rv"><span>${a}</span><h2>${b}</h2>${c?`<p>${c}</p>`:""}</div>`;
const ph=(t,s)=>`<section class="wrap ph rv"><div class="glass pad"><span class="tag">${C.name}</span><h1>${t}</h1><p class="lead">${s}</p></div></section>`;
const projGrid=()=>`<div class="grid">${PR.map(p=>`<article class="card glass rv"><div class="ic">${p[0]}</div><span class="tag">${p[1]}</span><h3>${p[2]}</h3><p>${p[3]}</p><span class="stat">${p[4]}</span></article>`).join("")}</div>`;
const nums=()=>`<div class="nums">${[["50000","+","Meals served"],["30000","+","Youth trained"],["20000","+","Saplings planted"],["28","","States reached"]].map(n=>`<div class="num glass rv"><b data-n="${n[0]}" data-s="${n[1]}">0</b><span>${n[2]}</span></div>`).join("")}</div>`;
const blogGrid=()=>`<div class="grid">${POSTS.map(p=>`<a href="#/post/${p.id}" class="card glass rv"><div class="bi" style="background:linear-gradient(135deg,${p.g})">${p.e}</div><span class="tag">${p.tag} · ${p.d}</span><h3>${p.t}</h3><p>${p.x}</p><span class="stat">Read more →</span></a>`).join("")}</div>`;
const gal=()=>`<div class="gal rv">${[["w","#14a39a,#9bd0f5","🎉","Community Campaign"],["","#f2994a,#ffc98b","🍱","Food Drive"],["","#5fd3c4,#0b6b73","📚","Classroom"],["","#9bd0f5,#14a39a","🌳","Plantation"],["","#ffc98b,#5fd3c4","🩺","Health Camp"]].map(g=>`<div class="${g[0]}" style="background:linear-gradient(135deg,${g[1]})">${g[2]}<span>${g[3]}</span></div>`).join("")}</div>`;
const vform=(t)=>`<form class="glass pad rv vf" novalidate><h3 style="font-size:1.5rem">${t}</h3><input name="n" placeholder="Your name" required><input name="e" type="email" placeholder="Email address" required><textarea name="m" rows="4" placeholder="Your message"></textarea><button class="btn pri" type="submit" style="justify-content:center">Send</button><div class="msg" role="status"></div></form>`;
const donate=()=>`<div class="glass pad rv"><h2>Be the Change <em>You Wish to See</em></h2><p class="mut">Every rupee counts. Choose an amount:</p><div class="amts"><button>₹500</button><button class="on">₹1,000</button><button>₹2,500</button><button>₹5,000</button></div><a class="btn acc don" href="#" target="_blank" rel="noopener">Donate ₹1,000 ♥</a></div>`;
const banner=()=>sec(`<div class="glass pad rv" style="text-align:center;padding:50px 24px"><h2>Join the <em>Movement</em></h2><p class="mut" style="max-width:560px;margin:0 auto 22px">Donate, volunteer or spread the word — every action matters.</p><a class="btn acc" href="#/donate">Donate Now</a> <a class="btn" href="#/volunteers">Become a Volunteer</a></div>`);
const info=()=>`<p class="mut">📍 ${C.addr}<br>📧 <a href="mailto:${C.email}">${C.email}</a><br>📞 ${C.phone}</p>`;

/* ============ 4. PAGES — ADD YOUR OWN HERE ============
   key: {t:"Title", nav:1 (title bar) or more:1 (⋮ menu), r:()=>"HTML"}
   Copy any line below, change the key, title and content — it appears in the menus and footer automatically. */
const PAGES={
home:{t:"Home",nav:1,r:()=>`<section class="wrap hero"><div class="rv"><span class="chip glass">🌍 Non-Profit Foundation · Est. 2020</span><h1>Empowering Communities <em>Together.</em></h1><p class="lead">We uplift underprivileged communities through education, food, healthcare, women empowerment and sustainability — one family, one village, one hope at a time.</p><div class="cta"><a href="#/volunteers" class="btn pri">Become a Volunteer →</a><a href="#/projects" class="btn">Our Projects</a></div></div><div class="vis rv"><div class="disc">🤝</div><div class="fc glass f1">50K+<small>Meals Served</small></div><div class="fc glass f2">200+<small>Volunteers</small></div></div></section>
<div class="wrap"><div class="tick glass"><div>${[0,1].map(()=>PR.map(p=>`<span>${p[0]} ${p[2]}</span>`).join("<span>•</span>")+"<span>•</span>").join("")}</div></div></div>`+
sec(head("Our Work","Community <em>Projects</em>","Six initiatives tackling the most pressing social challenges.")+projGrid())+
sec(head("Why It Matters","Social <em>Impact</em>")+nums())+
sec(head("Stories","Latest from the <em>Blog</em>")+blogGrid())+banner()},
about:{t:"About Us",nav:1,r:()=>ph("About <em>Us</em>","Founded in 2020 by friends who believed kindness scales.")+sec(`<div class="two"><div class="glass pad rv" style="min-height:300px;display:grid;place-items:center;font-size:6rem;background:linear-gradient(135deg,rgba(95,211,196,.45),rgba(255,201,139,.45))">🏡</div><div class="rv"><p class="mut"><b>${C.name}</b> is a registered non-profit creating lasting social impact. Our network of volunteers and professionals works hand in hand with local communities to deliver real, measurable change.</p><div class="badges"><span>✔ Registered Non-Profit</span><span>✔ 80G &amp; 12A</span><span>✔ CSR-1</span><span>✔ ISO Certified</span></div></div></div>`)+sec(`<div class="grid">${[["🎯","Our Mission","Lift communities through food, education, health and opportunity."],["👁️","Our Vision","A compassionate society where nobody is left behind."],["💚","Our Values","Dignity, transparency, unity and collective action."]].map(v=>`<div class="card glass rv"><div class="ic">${v[0]}</div><h3>${v[1]}</h3><p>${v[2]}</p></div>`).join("")}</div>`)},
projects:{t:"Projects",nav:1,r:()=>ph("Community <em>Projects</em>","From a plate of food to a future full of opportunity.")+sec(projGrid())+banner()},
impact:{t:"Impact",nav:1,r:()=>ph("Social <em>Impact</em>","Every initiative answers a real need and creates change that lasts.")+sec(nums()+`<blockquote class="glass rv">"Every contribution goes directly to essential causes — food, education, empowerment and sustainability."</blockquote>`)},
blog:{t:"Blog",nav:1,r:()=>ph("Our <em>Blog</em>","Field stories and updates from our journey.")+sec(blogGrid())},
gallery:{t:"Gallery",nav:1,r:()=>ph("Activities <em>Gallery</em>","Moments in action. Replace tiles with your own photos using CSS background-image.")+sec(gal())},
contact:{t:"Contact",nav:1,r:()=>ph("Get in <em>Touch</em>","We would love to hear from you.")+sec(`<div class="two"><div class="glass pad rv"><h3>Reach us</h3>${info()}</div>${vform("Send a message")}</div>`)},
volunteers:{t:"Volunteers",more:1,r:()=>ph("Powered by <em>200+ Volunteers</em>","People across India giving their time, skills and heart.")+sec(`<div class="av rv">${["#14a39a","#f2994a","#0b6b73","#5b9bd5","#e07a5f"].map((c,i)=>`<i style="background:${c}">${"ABCDE"[i]}</i>`).join("")}<i style="background:#7a8f94">+</i></div><div class="two">${`<div class="rv"><h2>Join the <em>Team</em></h2><p class="mut">Teach, cook, plant, organise or share your skills — there is a place for you.</p></div>`}${vform("Become a Volunteer")}</div>`)},
donate:{t:"Donate",more:1,r:()=>ph("Support <em>Our Work</em>","Your gift turns into meals, books, saplings and hope.")+sec(`<div class="two">${donate()}<div class="glass pad rv"><h3>Contact</h3>${info()}</div></div>`)},
faq:{t:"FAQ",more:1,r:()=>ph("Frequently <em>Asked</em>","Quick answers about our work.")+sec(`<div class="post">${[["Is my donation tax-deductible?","Yes, we hold 80G &amp; 12A certification (edit this answer)."],["How can I volunteer?","Open the Volunteers page and send your details."],["Where do you work?","Across multiple states — edit this answer."]].map(f=>`<details class="glass rv"><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join("")}</div>`)}
};

/* ============ 5. ENGINE (title bar, footer, router, menu) ============ */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const keys=Object.keys(PAGES),L=k=>`<a href="#/${k==="home"?"":k}" data-k="${k}">${PAGES[k].t}</a>`;
$("#links").innerHTML=keys.filter(k=>PAGES[k].nav).map(L).join("");
$("#drop").innerHTML=keys.filter(k=>PAGES[k].more).map(k=>`<a href="#/${k}" role="menuitem">📄 ${PAGES[k].t}</a>`).join("")+`<hr><button data-a="share" role="menuitem">📤 Share this page</button><button data-a="copy" role="menuitem">🔗 Copy link</button><button data-a="print" role="menuitem">🖨️ Print page</button><button data-a="mail" role="menuitem">✉️ Email us</button><button data-a="top" role="menuitem">⬆️ Back to top</button>`;
$("#foot").innerHTML=`<div><div class="brand" style="margin-bottom:10px"><span class="logo">♥</span>${C.name}</div><p style="margin:0">A non-profit committed to lasting social impact across education, food, women empowerment, animal welfare and the environment.</p></div><div><h4>Pages</h4>${keys.map(L).join("")}</div><div><h4>Contact</h4>${info()}</div><div class="copy">© ${new Date().getFullYear()} ${C.name}. All rights reserved. #TogetherWeRise</div>`;
$$("[data-f]").forEach(e=>e.textContent=C[e.dataset.f]);

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const t=e.target;t.classList.add("in");t.querySelectorAll("[data-n]").forEach(count);if(t.dataset.n)count(t);io.unobserve(t)}}),{threshold:.12});
function count(el){const n=+el.dataset.n,s=el.dataset.s;let st=null;const f=t=>{st=st||t;const k=Math.min((t-st)/1600,1);el.textContent=Math.floor(n*(1-Math.pow(1-k,3))).toLocaleString("en-IN")+(k<1?"":s);k<1&&requestAnimationFrame(f)};requestAnimationFrame(f)}

function route(){
  const [k,arg]=(location.hash.replace(/^#\/?/,"")||"home").split("/");let html,title;
  if(k==="post"){const p=POSTS.find(x=>x.id===arg);
    if(p){title=p.t;html=ph(p.t,`${p.tag} · ${p.d}`)+sec(`<article class="post glass pad rv"><div class="bi" style="background:linear-gradient(135deg,${p.g})">${p.e}</div>${p.b.map(x=>`<p>${x}</p>`).join("")}<a class="btn" href="#/blog">← All posts</a></article>`)}}
  else if(PAGES[k]){title=PAGES[k].t;html=PAGES[k].r()}
  if(!html){title="Page not found";html=ph("Page not <em>found</em>","That page does not exist.")+sec(`<a class="btn pri" href="#/">Go Home</a>`)}
  $("#view").innerHTML=html;document.title=title+" — "+C.name;
  $$("[data-k]").forEach(a=>a.classList.toggle("on",a.dataset.k===(k==="post"?"blog":k)));
  $$(".rv").forEach((e,i)=>{e.style.transitionDelay=(i%3)*90+"ms";io.observe(e)});
  $$(".amts").forEach(a=>setAmt(a.querySelector(".on")));
  closeAll();scrollTo({top:0,behavior:"instant"});
}
function setAmt(b){const box=b.closest(".glass");box.querySelectorAll(".amts button").forEach(x=>x.classList.toggle("on",x===b));const d=box.querySelector(".don");d.textContent="Donate "+b.textContent+" ♥";d.href=C.donate+"?amount="+b.textContent.replace(/\D/g,"")}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2200)}
function closeAll(){$("#drop").classList.remove("open");$("#links").classList.remove("open");$("#dots").setAttribute("aria-expanded","false")}
async function copy(){const u=location.href;try{await navigator.clipboard.writeText(u);toast("Link copied ✓")}catch(e){prompt("Copy this link:",u)}}

$("#dots").onclick=e=>{e.stopPropagation();const o=!$("#drop").classList.contains("open");closeAll();$("#drop").classList.toggle("open",o);$("#dots").setAttribute("aria-expanded",o)};
$("#menu").onclick=e=>{e.stopPropagation();const o=!$("#links").classList.contains("open");closeAll();$("#links").classList.toggle("open",o)};
$("#drop").onclick=e=>{const a=e.target.closest("[data-a]");if(!a)return;const x=a.dataset.a;closeAll();
  if(x==="print")print();else if(x==="top")scrollTo({top:0,behavior:"smooth"});else if(x==="copy")copy();else if(x==="mail")location.href="mailto:"+C.email;
  else if(x==="share"){navigator.share?navigator.share({title:document.title,url:location.href}).catch(()=>{}):copy()}};
document.addEventListener("click",e=>{if(!e.target.closest("nav"))closeAll();const b=e.target.closest(".amts button");if(b)setAmt(b)});
addEventListener("keydown",e=>e.key==="Escape"&&closeAll());
document.addEventListener("submit",e=>{const f=e.target.closest(".vf");if(!f)return;e.preventDefault();const m=f.querySelector(".msg"),n=f.n.value.trim(),em=f.e.value.trim();
  if(!n||!/^\S+@\S+\.\S+$/.test(em)){m.style.color="#d9534f";m.textContent="Please enter your name and a valid email.";return}
  m.style.color="";m.textContent="Thank you, "+n+"! We will be in touch. 💚";f.reset()}); /* demo: connect to Netlify Forms / Formspree to receive messages */
addEventListener("scroll",()=>{$("#nav").classList.toggle("sm",scrollY>40);$("#top").classList.toggle("show",scrollY>600)},{passive:true});
$("#top").onclick=()=>scrollTo({top:0,behavior:"smooth"});
addEventListener("hashchange",route);route();
</script>
</body>
</html>
